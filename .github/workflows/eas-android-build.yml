name: EAS Android build

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android production app
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20.19.4

      - name: Check Expo token is configured
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "Configure the EXPO_TOKEN repository Actions secret before running this workflow." >&2
            exit 1
          fi

      - name: Set up EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: 24.11.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Trigger Android production build
        run: eas build --platform android --profile production --non-interactive --no-wait
